    <path d="M28 316 H165 L199 259 L247 389 L287 281 L319 339 L343 316 H484" fill="none" stroke="#f7fcff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M28 316 H165 L199 259 L247 389 L287 281 L319 339 L343 316 H484" fill="none" stroke="url(#signal)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  </g></g>
