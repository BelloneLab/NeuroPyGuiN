    <ellipse cx="313" cy="177" rx="15" ry="19" fill="#193f54"/>
    <circle cx="194" cy="170" r="5.5" fill="#fff"/>
    <circle cx="308" cy="170" r="5.5" fill="#fff"/>
    <ellipse cx="175" cy="209" rx="19" ry="10" fill="#f4b8b6" opacity=".65"/>
    <ellipse cx="337" cy="209" rx="19" ry="10" fill="#f4b8b6" opacity=".65"/>
    <path d="M236 199 Q256 188 276 199 Q270 220 256 224 Q242 220 236 199 Z" fill="url(#gold)" stroke="#b57940" stroke-width="4" stroke-linejoin="round"/>
