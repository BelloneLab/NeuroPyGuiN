<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">NeuroPyGuiN app icon</title>
  <desc id="desc">A teal penguin crossed by a purple and cyan neural waveform. Transparent, scalable vector artwork.</desc>
  <defs>
    <linearGradient id="body" x1="120" y1="45" x2="360" y2="455" gradientUnits="userSpaceOnUse">
      <stop stop-color="#46b7ca"/><stop offset=".48" stop-color="#237b98"/><stop offset="1" stop-color="#153b54"/>
    </linearGradient>
    <linearGradient id="belly" x1="195" y1="150" x2="310" y2="437" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/><stop offset=".75" stop-color="#f5fbff"/><stop offset="1" stop-color="#b9dce9"/>
    </linearGradient>
    <linearGradient id="signal" x1="28" y1="300" x2="484" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6556a6"/><stop offset=".55" stop-color="#527da9"/><stop offset="1" stop-color="#39b4c5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffd077"/><stop offset="1" stop-color="#e5a04b"/>
    </linearGradient>
  </defs>
  <g id="penguin">
    <!-- Soft, outward flippers frame a squat, pear-shaped silhouette. -->
    <path d="M135 207 C97 215 58 259 52 292 C47 316 64 321 84 303 L132 267 Z" fill="#235a70"/>
    <path d="M377 207 C415 215 454 259 460 292 C465 316 448 321 428 303 L380 267 Z" fill="#235a70"/>
    <path d="M170 413 C140 420 117 442 131 455 C151 472 207 465 236 446 L223 416 Z" fill="url(#gold)" stroke="#173e54" stroke-width="9" stroke-linejoin="round"/>
    <path d="M342 413 C372 420 395 442 381 455 C361 472 305 465 276 446 L289 416 Z" fill="url(#gold)" stroke="#173e54" stroke-width="9" stroke-linejoin="round"/>
    <path d="M256 54 C171 54 125 104 124 170 C123 203 105 225 94 266 C66 370 125 449 256 449 C387 449 446 370 418 266 C407 225 389 203 388 170 C387 104 341 54 256 54 Z" fill="url(#body)"/>
    <!-- A generous white belly and heart-shaped face make the expression gentle. -->
    <path d="M256 183 C244 171 235 123 204 123 C163 122 143 163 158 199 C169 225 145 246 131 282 C107 354 153 426 256 426 C359 426 405 354 381 282 C367 246 343 225 354 199 C369 163 349 122 308 123 C277 123 268 171 256 183 Z" fill="url(#belly)"/>
    <ellipse cx="199" cy="177" rx="15" ry="19" fill="#193f54"/>
    <ellipse cx="313" cy="177" rx="15" ry="19" fill="#193f54"/>
    <circle cx="194" cy="170" r="5.5" fill="#fff"/>
    <circle cx="308" cy="170" r="5.5" fill="#fff"/>
    <ellipse cx="175" cy="209" rx="19" ry="10" fill="#f4b8b6" opacity=".65"/>
    <ellipse cx="337" cy="209" rx="19" ry="10" fill="#f4b8b6" opacity=".65"/>
    <path d="M236 199 Q256 188 276 199 Q270 220 256 224 Q242 220 236 199 Z" fill="url(#gold)" stroke="#b57940" stroke-width="4" stroke-linejoin="round"/>
    <!-- The signal remains legible on both light and dark backgrounds. -->
    <path d="M28 316 H165 L199 259 L247 389 L287 281 L319 339 L343 316 H484" fill="none" stroke="#f7fcff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M28 316 H165 L199 259 L247 389 L287 281 L319 339 L343 316 H484" fill="none" stroke="url(#signal)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
