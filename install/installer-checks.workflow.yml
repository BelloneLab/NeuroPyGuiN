name: Installer checks
on:
  push:
    paths:
      - 'Install-NeuroPyGuiN.*'
      - 'install/**'
      - 'tests/test_installer.py'
      - 'neuropyguin/assets/*.svg'
      - '.github/workflows/installer.yml'
  pull_request:
    paths:
      - 'Install-NeuroPyGuiN.*'
      - 'install/**'
      - 'tests/test_installer.py'
      - 'neuropyguin/assets/*.svg'
      - '.github/workflows/installer.yml'
  workflow_dispatch:

jobs:
  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest "PySide6>=6.5,<6.8" pillow
      - run: python -m pytest tests/test_installer.py -q
      - run: python install/prepare_icon.py neuropyguin/assets/neuropyguin-icon.svg icon-check.ico
      - name: Shell syntax
        if: runner.os == 'Linux'
        run: bash -n Install-NeuroPyGuiN.sh
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'install/install.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
