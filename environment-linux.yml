# NeuroPyGuiN - complete Linux environment (x86_64, NVIDIA CUDA 12).
#
# This single file installs EVERYTHING the app needs: the GUI, the bundled
# ecephys_spike_sorting pipeline, Kilosort 4 (+ PyTorch/CUDA), py_bombcell,
# NeuroPyxels post-processing, phy curation, and the histology stack.
#
# Fresh install:
#   conda env create -f environment-linux.yml
#   conda activate neuropyguin
#   python main.py
#
# Update an existing env:
#   conda env update -n neuropyguin -f environment-linux.yml --prune
#   conda deactivate && conda activate neuropyguin
#
# After launching, Help > Run Diagnostics re-checks every dependency below and
# reports anything missing (it runs automatically on the very first launch).
name: neuropyguin
variables:
  # Prevent packages installed with `pip --user` in ~/.local from shadowing this
  # environment. In particular, GUI-enabled OpenCV can overwrite Qt's plugin
  # path and make PySide6 fail to load the xcb platform plugin on Linux.
  PYTHONNOUSERSITE: "1"
channels:
  - conda-forge
dependencies:
  - python=3.10
  # Build tooling: needed for the direct-URL pip requirement (cachecache) below.
  - pip>=23
  - setuptools
  - wheel
  # tkinter: ecephys_spike_sorting/common/SGLXMetaToCoords.py imports it at module
  # level, so every Kilosort/CatGT module needs it. conda's python ships it via tk.
  - tk

  # --- Scientific core -----------------------------------------------------
  # numpy: Kilosort 4.1 and ibllib 4.x both support numpy 2, so the old "< 2"
  # pin is gone. The ceiling comes from numba (< 2.5) and cupy (< 2.6), and from
  # bundled code that still uses numpy-1 aliases (np.trapz, np.in1d) which are
  # deprecated but present up to 2.4.
  - numpy>=1.26,<2.5
  - scipy
  - pandas
  - matplotlib
  - numba
  - scikit-learn
  - imbalanced-learn
  - statsmodels
  - networkx
  - h5py
  - joblib
  - psutil
  - tqdm
  - seaborn
  - pyarrow
  - pillow
  - cmcrameri
  # xarray: ecephys_spike_sorting mean_waveforms writes its output as xarray.
  - xarray
  # The py_bombcell unit-quality GUI runs as a Jupyter notebook with ipywidgets,
  # launched from the curation tab. Without these the GUI silently never opens.
  - ipython
  - ipywidgets
  - jupyterlab
  # umap-learn: used by the UMAP / recluster phy plugins NeuroPyGuiN deploys into
  # ~/.phy/plugins. Missing it makes phy's plugin discovery fail on startup.
  - umap-learn

  # --- GUI runtime ---------------------------------------------------------
  # Keep PySide6 and its exact-version Shiboken companion under conda ownership.
  # Installing PySide6 with pip can make pip try to uninstall a conda-provided
  # shiboken6, which has no pip RECORD file and aborts environment creation.
  - pyside6>=6.5,<6.8

  # --- GPU: CuPy for CatGT-style filtering/whitening ------------------------
  #     (Kilosort itself uses PyTorch, installed in the pip section below.)
  - cupy
  - cuda-version=12

  - pip:
      # --- Kilosort 4 + PyTorch (CUDA 12.6) --------------------------------
      # The "+cu126" local version exists ONLY on the PyTorch index, so pip can
      # never silently substitute the CPU-only wheel from PyPI. Kilosort needs
      # torch >= 2.1; 2.8.0 is the tested build. For a different CUDA runtime or
      # CPU-only, swap cu126 -> cu121 / cu128 / cpu in BOTH lines below.
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.8.0+cu126
      # torchvision: imported by npyx's C4 feature helpers (waveform/ACG
      # transforms). Kept on the same index so it matches the torch build.
      - torchvision==0.23.0+cu126
      # Kilosort 4. 4.1.x is the tested series: the bundled ks4_helper calls
      # run_kilosort(..., clear_cache=, save_preprocessed_copy=, verbose_console=),
      # which those releases accept. It pulls faiss-cpu automatically.
      - kilosort>=4.1,<4.2

      # --- GUI -------------------------------------------------------------
      # PySide6 is deliberately installed by conda above. Do not add PySide6 or
      # shiboken6 here: pip cannot safely replace their conda-owned files.
      - pyqtgraph>=0.14.0,<0.15

      # --- Bundled ecephys_spike_sorting pipeline ---------------------------
      # argschema: every module's CLI entry point (`from argschema import
      # ArgSchemaParser`). GitPython: common/utils.py does `from git import Repo`
      # and is imported by every module. Without either, CatGT / Kilosort /
      # quality-metrics steps die at import time.
      # This legacy pipeline passes one combined JSON document to each module.
      # argschema 1.17.5 (Marshmallow 2) ignores sections owned by other modules;
      # argschema 3 rejects them as unknown fields before the module can run.
      - argschema==1.17.5
      - marshmallow>=2.15,<3
      - GitPython

      # --- Bundled py_bombcell ---------------------------------------------
      - upsetplot
      - mtscomp
      # cachecache is not reliably installable from PyPI. Install the upstream
      # v0.2.2 source at an immutable commit, without requiring Git locally.
      - "cachecache @ https://github.com/m-beau/cachecache/archive/aa96d4916618941868625a63575337f1e67b4635.zip"

      # --- phy manual curation ---------------------------------------------
      # phy 2.1 installs cleanly next to PySide6 (it is a PyQt5 app and
      # NeuroPyGuiN launches it as a separate process with QT_API=pyqt5), so it
      # no longer needs its own conda env. Pulls phylib, PyQt5, pyopengl,
      # qtconsole. seaborn (above) is needed by the mahalanobis plugin.
      - phy>=2.1,<3

      # --- Histology tab: native AP_histology workflow ----------------------
      #     (slice prep, atlas matching, alignment, probe tracing, MAT/CSV export)
      - tifffile
      - imagecodecs
      - opencv-python-headless
      # Channel map + optional IBL ephys-alignment GUI.
      - ibllib
      - iblatlas
      - SimpleITK

# --- Things conda cannot install for you -------------------------------------
#
# 1) Qt xcb system libraries (Linux only). The PySide6 wheel bundles Qt but not
#    these X11 libs:
#      sudo apt install libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
#                       libxcb-shape0 libxcb-xinerama0 libxkbcommon-x11-0
#
# 2) SpikeGLX helper binaries (Linux builds), then point the Preprocessing tab at
#    the folders that contain them: CatGT, TPrime, C_Waves.
#      https://billkarsh.github.io/SpikeGLX/
#
# 3) Allen Mouse Brain CCF 10um volumes for the Histology tab (download once,
#    then set Histology > Setup > Atlas folder, or NPG_ATLAS_PATH):
#      https://osf.io/fv7ed/overview
#
# 4) OPTIONAL - the C4 cerebellar cell-type classifier still runs in its own env,
#    because its `laplace-torch` dependency resolves a different torch build and
#    would break Kilosort's CUDA torch in this env:
#      conda create -n npyx_c4 python=3.10 -y
#      conda run -n npyx_c4 python -m pip install "npyx[c4]"
#      conda run -n npyx_c4 python -m pip install "setuptools<80" "scikit-learn<1.6"
#    Then export NPYX_C4_PYTHON=~/anaconda3/envs/npyx_c4/bin/python
#    (required on Linux: the app's default C4 lookup only probes Windows paths).
#
# 5) OPTIONAL - the IBL apps repo, for the ephys-alignment GUI. Clone it and set
#    Histology > Setup > iblapps folder:
#      git clone https://github.com/int-brain-lab/iblapps
